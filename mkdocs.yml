site_name: TRACE User Guide
site_description: User Guide and Technical Manual for the Triggered Radiotherapy Adaptive Control Engine (TRACE)
site_author: TRACE Development Team

repo_url: https://github.com/YourUsername/TRACE
repo_name: TRACE

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - with-pdf:
      output_path: exports/TRACE_User_Guide.pdf
      cover: true
      back_cover: true
      toc_title: Table of Contents
      heading_shift: false
      toc_level: 3
      ordered_chapter_level: 2

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Hardware Setup: getting-started/hardware-setup.md
  - User Guide:
      - 1. Files & Project Management: user-guide/01-files-tab.md
      - 2. Motion Planning & G-code: user-guide/02-motion-planning.md
      - 3. Phantom Control & Execution: user-guide/03-phantom-control.md
      - 4. Real-Time Status & Monitoring: user-guide/04-status-monitoring.md
  - Troubleshooting & Safety: troubleshooting/common-issues.md
